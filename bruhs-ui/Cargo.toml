[package]
name = "bruhs-ui"
version = "0.1.0"
description = "The Bruhs UI toolkit for GPUI: theme, text fields, rich text, scrolling, panels, buttons, menus"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Lets a dependent crate's tests run the components without OS hooks (the
# macOS reduced-motion observer), the way this crate's own tests do.
test-support = []

[lints]
workspace = true

[dependencies]
async-channel = "2"
bruhs-models = { workspace = true }
gpui = { workspace = true }
pulldown-cmark = { version = "0.13.3", default-features = false }
serde = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
