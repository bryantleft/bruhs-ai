[package]
name = "bruhs-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bruhs-models = { workspace = true }
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
futures-core = { workspace = true }
async-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
cpal = { workspace = true }
hound = "3.5"
whisper-rs = { version = "0.12", default-features = false }
rubato = "0.15"
rand = { workspace = true }
reqwest = { workspace = true, features = ["stream", "multipart"] }
thiserror = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
# Used outside tests too (atomic temp-file writes in transcribe/segments_log.rs),
# so this stays a normal dependency rather than a dev-dependency.
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.12", default-features = false, features = ["metal"] }
cidre = { git = "https://github.com/yury/cidre", rev = "b8631d2857e5d039594db7127cf5e3528016af90", default-features = false, features = ["sc", "cm", "cat", "blocks", "async", "dispatch", "vn", "macos_13_0"] }
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
