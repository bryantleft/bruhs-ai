version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # bruhs-backup declares `aes = "0.8"` only to enable `zeroize` via feature
      # unification with `aes-gcm = "0.10.3"`; keep aligned until aes-gcm upgrades.
      - dependency-name: aes
        versions: [">= 0.9.0"]
      # bruhs-core uses `markup5ever_rcdom = "0.3"` which requires `html5ever 0.27`.
      - dependency-name: html5ever
        versions: [">= 0.28.0"]
