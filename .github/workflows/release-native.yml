name: Release desktop binaries
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
permissions:
  contents: read
env:
  BRUHS_RELEASE_VERSION: ${{ inputs.version }}
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_STRIP: symbols
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake pkg-config libdbus-1-dev libasound2-dev libudev-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libfontconfig1-dev libfreetype6-dev libssl-dev libwebkit2gtk-4.1-dev dpkg-dev
      - name: Exercise Windows setup and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the setup compiler' }
          }
          $payload = Join-Path $env:RUNNER_TEMP 'bruhs-installer-payload'
          $setup = Join-Path $env:RUNNER_TEMP 'Bruhs-Windows-x64-Setup.exe'
          $executables = @('bruhs-desktop.exe', 'bruhs-server.exe', 'bruhs-capture.exe')
          $fixture = Join-Path $env:SystemRoot 'System32\whoami.exe'
          New-Item -ItemType Directory -Path "$payload\web" -Force | Out-Null
          foreach ($name in $executables) { Copy-Item $fixture (Join-Path $payload $name) }
          Copy-Item LICENSE $payload
          Set-Content "$payload\web\index.html" '<title>Bruhs installer fixture</title>'
          & $compiler /WX /V2 "/DPAYLOAD=$payload" "/DOUTPUT=$setup" "/DVERSION=$env:BRUHS_RELEASE_VERSION" packaging/windows/bruhs.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Windows setup compilation failed' }
          $install = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup failed with exit code $($install.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs\Bruhs'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Bruhs.lnk'
          $registration = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Bruhs'
          foreach ($file in ($executables + @('web\index.html', 'LICENSE', 'Uninstall.exe'))) {
            if (!(Test-Path (Join-Path $root $file))) { throw "Setup did not install $file" }
          }
          if (!(Test-Path $shortcut)) { throw 'Start shortcut missing' }
          if ((Get-ItemProperty $registration).DisplayVersion -ne $env:BRUHS_RELEASE_VERSION) { throw 'Uninstall registration has the wrong version' }
          $uninstaller = Join-Path $env:RUNNER_TEMP 'Bruhs-Uninstall.exe'
          Copy-Item "$root\Uninstall.exe" $uninstaller
          $uninstall = Start-Process $uninstaller -ArgumentList '/S', "_?=$root" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $root) -or (Test-Path $shortcut) -or (Test-Path $registration)) { throw 'Setup left an installed application behind' }
      - run: cargo build --release --locked -p bruhs-desktop -p bruhs-server -p bruhs-capture
      - name: Stage binaries and record build identity
        shell: bash
        run: |
          set -eu
          mkdir native
          ext=""
          if [[ $RUNNER_OS == Windows ]]; then ext=".exe"; fi
          for bin in bruhs-desktop bruhs-capture bruhs-server; do cp "target/release/$bin$ext" native/; done
          git rev-parse HEAD > native/commit
          echo "$BRUHS_RELEASE_VERSION" > native/version
      - name: Resolve Ubuntu runtime dependencies
        if: runner.os == 'Linux'
        run: |
          mkdir -p debian
          touch debian/control
          dpkg-shlibdeps -O native/bruhs-* | sed 's/^shlibs:Depends=//' > native/depends
          test -s native/depends
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ runner.os }}
          path: native/
          if-no-files-found: error
