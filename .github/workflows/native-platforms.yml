name: Native desktop platforms
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44444352371 -n native-$RUNNER_OS -D native
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get satisfy -y "$(cat native/depends), libxkbcommon-x11-0, libvulkan1, mesa-vulkan-drivers, xvfb, xauth, fonts-dejavu-core"
          chmod +x native/bruhs-*
      - name: Start packaged desktop and verify bundled helper identity
        shell: bash
        run: |
          mkdir -p native/web
          echo smoke > native/web/index.html
          if [[ $RUNNER_OS == Linux ]]; then
            xvfb-run -a python3 scripts/release-startup-test.py
          else
            python scripts/release-startup-test.py
          fi
