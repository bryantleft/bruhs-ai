name: Native desktop platforms
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download draft release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $RUNNER_OS == Linux ]]; then file=Bruhs-Linux-x64.deb; else file=Bruhs-Windows-x64.zip; fi
          gh release download v0.2.0 --pattern "$file" --pattern SHA256SUMS
          grep -F "$file" SHA256SUMS | sha256sum --check -
      - name: Install Ubuntu package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ./Bruhs-Linux-x64.deb xvfb xauth fonts-dejavu-core mesa-vulkan-drivers
          xvfb-run -a python3 scripts/release-startup-test.py
      - name: Extract and launch portable Windows package
        if: runner.os == 'Windows'
        run: |
          Expand-Archive Bruhs-Windows-x64.zip .
          python scripts/release-startup-test.py
