[package]
name = "bruhs-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bruhs-models = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
# Default feature set of futures-util, spelled out because the workspace entry
# turns defaults off.
futures-util = { workspace = true, features = ["std", "async-await", "async-await-macro"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "KeyboardEvent", "Element", "Node", "NodeList", "ScrollIntoViewOptions", "ScrollLogicalPosition",
    "HtmlElement", "HtmlAnchorElement", "HtmlTextAreaElement", "HtmlInputElement", "HtmlSelectElement",
    "MouseEvent", "EventSource", "MessageEvent",
    "Window", "Document", "History", "EventTarget", "Event",
    "ReadableStream", "ReadableStreamDefaultReader",
    "TextDecoder", "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "Blob", "BlobPropertyBag", "File", "FileList", "Url", "Storage",
    "AbortController", "AbortSignal", "IdbTransaction", "HtmlDetailsElement",
    "WebSocket", "BinaryType", "CloseEvent", "ResizeObserver", "ResizeObserverEntry",
    "DragEvent", "DataTransfer", "ClipboardEvent", "PointerEvent", "DomRect", "CssStyleDeclaration",
    "Selection", "Range",
    "AudioContext", "AudioContextOptions", "AudioNode", "AudioDestinationNode",
    "AudioProcessingEvent", "AudioBuffer",
    "MediaDevices", "Navigator",
    "MediaStream", "MediaStreamConstraints",
    "MediaStreamAudioSourceNode",
    "MediaStreamTrack",
    "ScriptProcessorNode",
    "Performance",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"
uuid = { workspace = true, features = ["js"] }
idb = "0.6"
serde-wasm-bindgen = "0.6"
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
