[package]
name = "bruhs-server"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bruhs-core = { workspace = true }
bruhs-models = { workspace = true }
axum = { workspace = true, features = ["json", "ws", "multipart"] }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true, features = ["cors", "fs", "trace", "set-header", "compression-gzip"] }
thiserror = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
async-stream = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
home = "0.5"
chrono = { workspace = true }
flate2 = "1"
sha2 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["multipart"] }
base64 = "0.22"
bruhs-core = { workspace = true, features = ["test-support"] }
wiremock = "0.6"
rusqlite = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = "0.29"
