[workspace]
members = [
    "crates/base",
    "crates/component",
    "crates/component-macros",
    "crates/assets",
]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
gpui-component = { path = "crates/component", version = "0.10.0" }
gpui-base = { path = "crates/base", version = "0.10.0" }
gpui-component-macros = { path = "crates/component-macros", version = "0.10.0" }
gpui-kit-assets = { path = "crates/assets", version = "0.10.0" }

# gpui comes from upstream zed at the rev the root Cargo.toml pins; bump both
# together (see VENDORED.md, "gpui pins"). Upstream uses the `gpui-pre-*`
# crates.io snapshots of zed; this is the zed commit 0.3.12 was cut from.
gpui = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", version = "0.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b" }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b" }
sum-tree = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", package = "sum_tree" }
# Optional upstream backend; no feature here enables it, so it is never resolved.
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "33bc764aa15ff7b200bf7c93bd96e24878d53e14", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }

anyhow = "1"
instant = { version = "0.1", features = ["wasm-bindgen"] }
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8.2.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "4.2.0"
schemars = "1"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
tracing = "0.1.41"
wasm-bindgen = "0.2.113"
# Use errno stub for WASM
errno = { version = "0.3.14", default-features = false }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
redundant_clone = "deny"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-kit/pull/2149
useless_conversion = "allow"


[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

[workspace.metadata.typos.default.extend-identifiers]
consts = "consts"

[workspace.metadata.cargo-machete]
ignored = ["log", "anyhow", "serde"]
