# cargo-deny policy, checked in CI by .github/workflows/ci.yml (`deny` job).
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and on unmaintained / unsound crates that are
# direct dependencies of a workspace member.
unmaintained = "workspace"
yanked = "deny"
# quick-xml 0.39 is reached only through gpui_linux -> accesskit_unix ->
# zbus_xml, which is Linux-only and never compiled for the macOS desktop app;
# zbus_xml pins ^0.39, so there is no patched version to move to yet. Remove
# these when gpui moves to a zbus_xml that accepts quick-xml >= 0.41.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 only via Linux-only gpui_linux -> zbus_xml; not built here" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 only via Linux-only gpui_linux -> zbus_xml; not built here" },
]

[licenses]
# Compound SPDX expressions (`A OR B`) pass if either side is allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

# zed's GPL-3.0 `ztracing`/`zlog`/`ztracing_macro` are patched out (see
# third_party/ztracing-noop), so no license exceptions are needed.

# zed crates that do not declare a `license` field in Cargo.toml; the zed
# repository ships LICENSE-APACHE for them.
[[licenses.clarify]]
crate = "gpui_util"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "gpui_shared_string"
expression = "Apache-2.0"
license-files = []

[bans]
# Duplicate versions are reported, not fatal: most come from gpui / zed
# transitive pins we do not control.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every git source in Cargo.lock. The zed fork carries gpui (see the note in
# the root Cargo.toml); the rest are pulled in by gpui / bruhs-capture.
allow-git = [
    "https://github.com/bnleft/zed",
    "https://github.com/yury/cidre",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/reqwest.git",
    "https://github.com/zed-industries/scap",
    "https://github.com/proptest-rs/proptest",
]
