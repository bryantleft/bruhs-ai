[package]
name = "bruhs-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "bruhs-desktop"

[features]
# gpui's frame timings sit behind its `profiler` feature.
native-performance = ["gpui/profiler"]
whiteboard-benchmark = ["gpui/profiler"]

[[bin]]
name = "bruhs-whiteboard-performance"
path = "src/whiteboard_performance_entry.rs"
required-features = ["whiteboard-benchmark"]
test = false
bench = false

[[bin]]
name = "bruhs-native-performance"
path = "src/native_performance_entry.rs"
required-features = ["native-performance"]
test = false
bench = false

[lints]
workspace = true

[dependencies]
# SIGTERM for the bundled helpers on quit: bruhs-server shuts down cleanly on
# it; anything still running after 5 s is killed.
libc = "0.2"
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
alacritty_terminal = "0.26"
async-channel = "2"
base64 = "0.22"
unicode-segmentation = "1"
regex = "1"
bruhs-core = { workspace = true }
bruhs-models = { workspace = true }
bruhs-ui = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
cpal = { workspace = true }
csscolorparser = "0.9.2"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
serde_json_lenient = "0.2.4"
directories = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
# gpui comes from upstream zed, pinned once in the root Cargo.toml
# ([workspace.dependencies]); see the note there before bumping the rev.
gpui = { workspace = true }
gpui_platform = { workspace = true, features = ["font-kit"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
markdown = "1"
reqwest = { workspace = true, features = ["stream", "multipart"] }
mathjax-svg-rs = "0.4.0"
mermaid-rs-renderer = { version = "0.2.2", default-features = false }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
simdutf8 = "0.1.5"
memchr = "2"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true }
# The live view's socket; plain ws:// to the local server, so no TLS.
tokio-tungstenite = "0.29"
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
# Embedded preview (WKWebView as a child of the gpui window).
wry = { version = "0.55", default-features = false, features = ["fullscreen"] }
# Backdrop blur behind modal scrims (a Core Image filter on a native layer
# above the Metal one).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSGraphics", "NSWindow", "NSAccessibilityProtocols", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSUndoManager", "NSDateFormatter", "NSLocale"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# WebView2 attaches its owned child HWND to the GPUI Win32 window.
wry = { version = "0.55", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The shared platform dependency enables fonts only. Both window backends are
# needed: X11/XWayland hosts native previews; pure Wayland still opens the app
# and explains the missing XWayland requirement instead of panicking at startup.
gpui_platform = { workspace = true, features = ["x11", "wayland"] }
# GPUI is not a GTK app. Its X11/XWayland window is the native parent; the
# adapter initializes GTK and dispatches GLib events on GPUI's main thread.
wry = { version = "0.55", default-features = false, features = ["os-webview", "x11"] }
gtk = "0.18"
gdkx11 = "0.18"
x11-dl = "2.21"
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"

[dev-dependencies]
bruhs-core = { workspace = true, features = ["test-support"] }
bruhs-ui = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
