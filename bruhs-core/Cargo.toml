[package]
name = "bruhs-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Test fixtures for other crates' tests (e.g. BackgroundTaskRegistry::update).
test-support = []

[dependencies]
semver = "1"
bruhs-models = { workspace = true }
bruhs-backup = { workspace = true }
claude-sdk-rs = { path = "../claude-sdk-rs" }
codex-sdk-rs = { path = "../codex-sdk-rs" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "net", "io-util", "io-std", "fs"] }
tokio-stream = { workspace = true }
tokio-tungstenite = "0.29"
portable-pty = "0.9"
# portable-pty reports its errors as anyhow::Error; kept as error sources.
anyhow = "1"
futures-core = { workspace = true }
futures-util = { workspace = true }
async-trait = "0.1"
# ── Phase 1 (Calendar v1 Google Sync) ──
reqwest = { workspace = true, features = ["stream"] }
axum = { workspace = true }
keyring = { workspace = true }
directories = { workspace = true }
base64 = "0.22"
percent-encoding = "2"
zip = { version = "9.5.1", default-features = false }
hmac = "0.12"
# One-time codes (RFC 6238) use HMAC-SHA1 by default.
sha1 = "0.10"
sha2 = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
url = "2"
tracing = { workspace = true }
thiserror = { workspace = true }
# `serde`: keychain items travel inside sealed sets and backups.
zeroize = { workspace = true, features = ["serde"] }
htmd = "0.6"
dom_query = "0.27"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
mail-builder = { version = "=0.4.4", default-features = false }
cssparser = "0.36"
ress = "0.11.7"
libc = "0.2"
# Backup walks the data roots through folder handles, never following a link.
rustix = { version = "1", features = ["fs"] }
# `backup`: rollback-mode databases are snapshotted with the online backup API.
rusqlite = { workspace = true, features = ["backup"] }
# Backups are a tar stream inside the encrypted container (no xattrs).
tar = { version = "0.4", default-features = false }
tokio-postgres = "=0.7.18"
sqlparser = { version = "=0.64.0", features = ["visitor"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
qrcodegen = "=1.8.0"
hyper = { version = "1", features = ["server", "client", "http1"] }
# The network guard streams forwarded bodies and answers its own refusals.
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
# Fresh empty working directory for the summary CLI.
tempfile = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# sha2 0.10 otherwise uses its software ARM backend. Save/checksum measurements
# are recorded in docs/performance-goal-2026-11-09.md; CPU detection retains the
# portable fallback when SHA instructions are unavailable.
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Include trusted roots installed by macOS device management.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
# Pith's scanner measures what deleting a worktree frees from APFS private
# sizes and clone counts, which `du` overstates for copy-on-write clones.
storage-scanner = { git = "https://github.com/bryantleft/bruhs", rev = "739a4bb85a973c40f1c5f9a550f2024ce7528ab4" }

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
