[package]
name = "codex-sdk-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Rust SDK for Codex CLI - wraps codex exec JSON streams"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["codex", "openai", "sdk", "cli"]
categories = ["api-bindings", "asynchronous"]
# Internal for now; it has no crates.io publishing metadata of its own.
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "macros", "time"] }
futures-core = { workspace = true }
thiserror = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
