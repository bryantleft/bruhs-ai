[package]
name = "sse-encoding-probe"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
axum = { version = "=0.8.9", features = ["json", "ws"] }
futures-util = { version = "=0.3.32", features = ["sink"] }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
simdutf8 = "=0.1.5"
tokio = { version = "=1.54.1", features = ["full"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "=0.10.9", features = ["asm"] }

[features]
count-allocations = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
axum = { path = "../../third_party/axum" }
