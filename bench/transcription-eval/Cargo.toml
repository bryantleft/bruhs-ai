[package]
name = "bruhs-transcription-eval"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
bruhs-models = { path = "../../bruhs-models" }
hound = "=3.5.1"
rubato = "=0.15.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
whisper-rs = { version = "=0.12.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.12.0", default-features = false, features = ["metal"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[profile.release]
debug = false
incremental = false

