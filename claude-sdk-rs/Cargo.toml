[package]
name = "claude-sdk-rs"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Rust SDK for Claude Code — wraps the claude CLI"
license = "MIT"
repository = "https://github.com/bryantleft/claude-sdk-rs"
readme = "README.md"
keywords = ["claude", "claude-code", "anthropic", "sdk", "cli"]
categories = ["api-bindings", "asynchronous"]
# Internal by choice: we keep our own CLI wrappers so they fit bruhs'
# needs. Not published, because the crates.io name `claude-sdk-rs` belongs
# to an unrelated crate and public wrappers already exist (e.g.
# `claude-codes`). Publish only if no equivalent crate exists.
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "macros", "time"] }
futures-core = { workspace = true }
thiserror = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
