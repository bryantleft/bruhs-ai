[package]
name = "bruhs-models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Pure data types shared across every surface — web (wasm), server, desktop,
# mcp. Intentionally has no async, no I/O, no platform deps so it compiles
# anywhere `serde` + `uuid` does (including wasm32-unknown-unknown).

[dependencies]
serde = { workspace = true }
uuid = { workspace = true, features = ["js"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
thiserror = { workspace = true }

