[package]
name = "bruhs-models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Pure data types shared across every surface — web (wasm), server, desktop,
# mcp. Intentionally has no async, no I/O, no platform deps so it compiles
# anywhere `serde` + `uuid` does (including wasm32-unknown-unknown).

[dependencies]
serde = { workspace = true, features = ["rc"] }
uuid = { workspace = true, features = ["js", "serde"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
thiserror = { workspace = true }
pulldown-cmark = { version = "0.13.3", default-features = false }
percent-encoding = "2"
# NFC before a backup password reaches the key derivation (`backup::normalize_password`).
unicode-normalization = "0.1.26"
sha2 = { workspace = true }
shell-words = "=1.1.1"
base64 = "0.22"
email_address = { version = "=0.2.9", default-features = false }
# Case-insensitive ASCII scans of workspace reads (`workspace_bridge::query`).
memchr = "2"

